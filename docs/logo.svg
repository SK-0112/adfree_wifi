<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AdFree logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#7b5cff"/>
    </linearGradient>
    <mask id="cut">
      <rect width="64" height="64" fill="#fff"/>
      <!-- the slash is punched out, so the arcs read as "broken" rather than overprinted -->
      <line x1="14" y1="52" x2="52" y2="12" stroke="#000" stroke-width="9" stroke-linecap="round"/>
    </mask>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#g)"/>

  <g mask="url(#cut)" fill="none" stroke="#fff" stroke-linecap="round">
    <path d="M15 30.5a24 24 0 0 1 34 0" stroke-width="4.6" opacity=".55"/>
    <path d="M21.5 37.5a15 15 0 0 1 21 0" stroke-width="4.6" opacity=".8"/>
