; ---------------------------------------------------------------------------
;  AdFree - ESP32-S3 network-wide DNS ad blocker
;
;  env:fresh   -> the RELEASE build. No Wi-Fi baked in, ever. The board boots
;                 into its ADBLOCK-SETUP hotspot and is provisioned from a
;                 phone. This is what the web installer and GitHub Releases
;                 ship, and the only env that is safe to publish.
;                     pio run -e fresh -t upload
;
;  env:seeded  -> development convenience. Bakes the Wi-Fi/admin credentials
;                 from src/seed_credentials.h (gitignored) into the image so a
;                 board comes up already on your network. Never publish this.
;                     pio run -e seeded -t upload
; ---------------------------------------------------------------------------

[common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize

; gzips web/index.html into src/web_page.h before every build
extra_scripts = pre:scripts/embed_web.py

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DADBLOCK_LED_PIN=48

lib_deps =
    bblanchon/ArduinoJson @ ^7.2.1
    ESP32Async/ESPAsyncWebServer @ ^3.7.0
    ESP32Async/AsyncTCP @ ^3.3.5
    adafruit/Adafruit NeoPixel @ ^1.12.3

; --- Release build: no credentials, boots into the setup portal ---------------
[env:fresh]
extends = common
; no upload_port  -> PlatformIO auto-detects whichever port the board shows up on
; no ADBLOCK_ALLOW_SEED -> src/seed_credentials.h is ignored even if it exists

; --- Development build: credentials pre-seeded from seed_credentials.h --------
[env:seeded]
extends = common
build_flags =
    ${common.build_flags}
    -DADBLOCK_ALLOW_SEED
